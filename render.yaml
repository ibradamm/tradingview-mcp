# Render Blueprint (alternative host). Render dashboard -> New -> Blueprint -> select this repo.
# Free plan: 512 MB RAM, shared CPU, sleeps after 15 min idle (first request then takes ~1 min).
# The token is generated by Render; copy it from the service's Environment tab.
services:
  - type: web
    name: trading-mcp
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MCP_AUTH_TOKEN
        generateValue: true
      - key: MARKET_DATA_PROVIDER
        value: yahoo
      - key: LOG_LEVEL
        value: INFO
