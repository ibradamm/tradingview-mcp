name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
          POSTGRES_DB: trading
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trading" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://trading:trading@localhost:5432/trading
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev,postgres]"
      - name: Lint
        run: .venv/bin/ruff check src tests
      - name: Unit tests (offline, synthetic data + PostgreSQL)
        run: .venv/bin/pytest -m "not live" -rs
      - name: Live data tests (real Yahoo Finance data, informative)
        continue-on-error: true
        run: .venv/bin/pytest -m live -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t trading-mcp:ci .
      - name: Run container and verify end-to-end (real market data)
        run: |
          python3 -m pip install -q httpx "mcp>=2.2,<3"
          TOKEN=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$TOKEN"
          docker run -d --name mcp -p 8000:8000 -e MCP_AUTH_TOKEN="$TOKEN" trading-mcp:ci
          for i in $(seq 1 40); do curl -sf localhost:8000/health && break; sleep 1; done
          docker inspect --format '{{.State.Health.Status}}' mcp || true
          MCP_VERIFY_TOKEN="$TOKEN" python3 scripts/verify_endpoint.py http://localhost:8000
          if docker logs mcp 2>&1 | grep -q "$TOKEN"; then echo "TOKEN LEAKED IN LOGS"; exit 1; fi
          docker logs mcp 2>&1 | tail -20
